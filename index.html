
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps API Explorer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 20px;
            background: #f3f6fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            background: #174ea6;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin-top: 0;
        }

        button {
            padding: 12px 20px;
            background: #174ea6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #103778;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin: 20px 0;
            font-weight: bold;
        }

        #users {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(240px, 1fr)
            );
            gap: 15px;
        }

        .user {
            background: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000010;
            overflow-wrap: anywhere;
        }

        .user h3 {
            color: #174ea6;
            margin-top: 0;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>DevOps API Explorer</h1>
            <p>
                A simple website that fetches user data
                from an external API.
            </p>
        </header>

        <button id="loadUsers">Load Users</button>

        <p id="status" role="status">
            Click the button to fetch users.
        </p>

        <div id="users"></div>

        <footer>
            Built to practise Git, GitHub and CI/CD.
        </footer>
    </div>

    <script>
        const button = document.getElementById("loadUsers");
        const status = document.getElementById("status");
        const usersContainer = document.getElementById("users");

        button.addEventListener("click", async function () {
            button.disabled = true;
            status.textContent = "Loading users...";
            usersContainer.replaceChildren();

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error("HTTP error: " + response.status);
                }

                const users = await response.json();

                users.forEach(function (user) {
                    const card = document.createElement("div");
                    card.className = "user";

                    const name = document.createElement("h3");
                    name.textContent = user.name;

                    const email = document.createElement("p");
                    email.textContent = "Email: " + user.email;

                    const city = document.createElement("p");
                    city.textContent = "City: " + user.address.city;

                    card.append(name, email, city);
                    usersContainer.appendChild(card);
                });

                status.textContent =
                    "Success! Loaded " + users.length + " users.";

            } catch (error) {
                console.error("API request failed:", error);

                status.textContent =
                    "Could not load users. Check your internet connection and try again.";

            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
